# ============================================
# Nginx Config — 白夜書簡 · 蚀羽版
# 部署路径: /etc/nginx/sites-available/corrofea
# 启用: ln -s /etc/nginx/sites-available/corrofea /etc/nginx/sites-enabled/
# ============================================

server {
    listen 80;
    listen [::]:80;

    # 域名（替换为你的实际域名）
    server_name corrofea.com www.corrofea.com;

    # 网站根目录（只部署 public/）
    root /var/www/corrofea/public;
    index index.html;

    # ---- Gzip 压缩 ----
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 256;
    gzip_vary on;

    # ---- 静态资源缓存 ----
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /styles/ {
        expires 7d;
        add_header Cache-Control "public";
    }

    location /scripts/ {
        expires 7d;
        add_header Cache-Control "public";
    }

    # ---- 项目 Demo 托管 ----
    # 将网页游戏等 Demo 放入 /var/www/corrofea/public/demos/ 目录
    # 通过 https://corrofea.com/demos/project-name/ 访问
    location /demos/ {
        expires 7d;
        add_header Cache-Control "public";
        # 允许所有静态文件类型
    }

    # ---- 项目数据文件 ----
    location = /projects.json {
        add_header Cache-Control "public, max-age=3600";
    }

    # ---- Markdown 文件允许访问 ----
    location /posts/ {
        add_header Content-Type "text/plain; charset=utf-8";
        add_header Cache-Control "public, max-age=3600";
    }

    # ---- JSON 索引文件 ----
    location = /posts-index.json {
        add_header Cache-Control "public, max-age=3600";
    }

    # ---- 安全：禁止访问隐藏文件 ----
    location ~ /\. {
        deny all;
    }

    # ---- 自定义 404 页面 ----
    error_page 404 /404.html;

    # ---- 日志 ----
    access_log /var/log/nginx/corrofea.access.log;
    error_log /var/log/nginx/corrofea.error.log;
}

