<script>
(function () {
  /* ---- Render post list (sync, no fetch needed) ---- */
  function renderPostList() {
    var container = document.getElementById('post-list');
    if (!container) return;
    var lang = I18n.lang();
    var posts = Posts.publishedSync();

    if (!posts || posts.length === 0) {
      container.innerHTML = '<div class="home-empty">' + I18n.t('home.no_posts') + '</div>';
      return;
    }

    var html = '';
    for (var i = 0; i < posts.length; i++) {
      var p = posts[i];
      var title = Posts.localize(p, 'title', lang);
      var summary = Posts.localize(p, 'summary', lang);
      var date = Posts.formatDate(p.date);
      var tagsHtml = '';
      for (var j = 0; j < (p.tags || []).length; j++) {
        tagsHtml += '<span class="post-card-tag">#' + p.tags[j] + '</span>';
      }

      html += '<article class="post-card">' +
        '<div class="post-card-date">' + date + '</div>' +
        '<h2 class="post-card-title"><a href="post.html?slug=' + p.slug + '">' + title + '</a></h2>' +
        (summary ? '<p class="post-card-summary">' + summary + '</p>' : '') +
        '<div class="post-card-tags">' + tagsHtml + '</div>' +
        '</article>';
    }
    container.innerHTML = html;
  }

  I18n.onChange(function () { renderPostList(); });
  window.renderPostList = renderPostList;
  window.initHome = renderPostList;
})();
</script>
