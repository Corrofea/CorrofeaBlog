<!DOCTYPE html>
<html lang="zh" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="标签 — 蚀羽 · corrofea" />
  <title data-i18n="tags.title">标签 — 蚀羽 · corrofea</title>

  <!-- Fonts — 非阻塞加载 -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Babylonica&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=JetBrains+Mono:ital,wght@0,400;0,500;1,400&family=Noto+Serif+SC:wght@300;400;500;600&display=swap" rel="stylesheet" media="print" onload="this.media='all'; this.onload=null;" />
  <noscript><link href="https://fonts.googleapis.com/css2?family=Babylonica&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=JetBrains+Mono:ital,wght@0,400;0,500;1,400&family=Noto+Serif+SC:wght@300;400;500;600&display=swap" rel="stylesheet" /></noscript>

  <!-- Minimal critical inline -->
  <style>
    body{background:#FCFAF7;color:#262626;font-family:"Times New Roman","PingFang SC","Microsoft YaHei",sans-serif;margin:0;min-height:100vh}
    [data-theme="dark"] body{background:#15151A;color:#EDE9E2}
  </style>

  <!-- Styles (single bundle, no @import chain) -->
  <link rel="stylesheet" href="styles/bundle.css?v=1786068559" />
</head>
<body>
  <div class="page">
    <div id="site-header"></div>

    <main>
      <div class="container">
        <div class="archive-header">
          <h1 class="archive-title" data-i18n="tags.heading">标签</h1>
        </div>

        <div id="tags-content">
          <!-- Dynamically rendered -->
        </div>
      </div>
    </main>

    <div id="site-footer"></div>
  </div>

  <button id="btn-back-to-top" class="btn-back-to-top" aria-label="Back to top">↑</button>

  <!-- Scripts -->
  <script src="scripts/utils/i18n.js?v=1786068559"></script>
  <script src="scripts/utils/router.js?v=1786068559"></script>
  <script src="scripts/utils/posts.js?v=1786068559"></script>
  <script src="scripts/components/theme.js?v=1786068559"></script>
  <script src="scripts/components/header.js?v=1786068559"></script>
  <script src="scripts/components/footer.js?v=1786068559"></script>

  <script>
    async function renderTags() {
      const container = document.getElementById('tags-content');
      const tags = await Posts.allTags();
      const posts = await Posts.published();
      const lang = I18n.lang();

      if (tags.length === 0) {
        container.innerHTML = '<p style="text-align:center;color:var(--color-text-muted);padding:4rem 0;">' + I18n.t('tags.empty') + '</p>';
        return;
      }

      container.innerHTML = tags.map(({ name, count }) => {
        const tagPosts = posts.filter(p => (p.tags || []).includes(name));
        const items = tagPosts.map(p => {
          const title = Posts.localize(p, 'title', lang);
          const date = Posts.formatDate(p.date);
          return `
            <div class="archive-item">
              <span class="archive-item-date">${date}</span>
              <span class="archive-item-title">
                <a href="post.html?slug=${p.slug}">${title}</a>
              </span>
            </div>
          `;
        }).join('');

        return `
          <section class="archive-year" style="margin-bottom:2rem;">
            <div class="archive-year-label">#${name} <span style="font-weight:300;">(${count})</span></div>
            ${items}
          </section>
        `;
      }).join('');
    }

    I18n.onChange(() => renderTags());
    window.renderPostList = renderTags;
    window.initTags = renderTags;
  </script>

  <script src="scripts/main.js?v=1786068559"></script>
</body>
</html>
