  <script>
    let _currentSlug = null;

    async function renderPost(slug) {
      try {
        if (!slug) {
          setTitle('羽落无声');
          return;
        }
        _currentSlug = slug;
        var lang = I18n.lang();
        var post = await Posts.getBySlug(slug);

        if (!post) {
          setTitle('此羽未落');
          return;
        }

        var title = Posts.localize(post, 'title', lang);
        document.title = title + ' — 蚀羽 · corrofea';
        setMeta('meta[name="description"]', Posts.localize(post, 'summary', lang) || title);
        setMeta('meta[property="og:title"]', title);
        setMeta('meta[property="og:description"]', Posts.localize(post, 'summary', lang) || title);

        setTitle(title);
        var date = Posts.formatDate(post.date);
        document.getElementById('post-meta').textContent = date;

        var tagsHtml = '';
        var tags = post.tags || [];
        for (var i = 0; i < tags.length; i++) {
          tagsHtml += '<span class="post-tag">#' + tags[i] + '</span>';
        }
        document.getElementById('post-tags').innerHTML = tagsHtml;

        var contentEl = document.getElementById('post-content');
        contentEl.innerHTML = '<p style="text-align:center;color:var(--color-text-muted);">羽笔蘸墨中……</p>';

        var html = await Posts.renderContent(slug, lang);
        if (html) {
          contentEl.innerHTML = html;
          addCopyButtons(contentEl);
          initLightbox(contentEl);
          buildTOC();
          if (typeof mermaid !== 'undefined') {
            // Save original mermaid source code before rendering
            var mermaidSources = [];
            var blocks = document.querySelectorAll('.mermaid');
            for (var b = 0; b < blocks.length; b++) {
              mermaidSources.push(blocks[b].textContent);
            }

            window.renderMermaid = function () {
              var isDark = document.documentElement.getAttribute('data-theme') === 'dark';
              var container = document.getElementById('post-content');
              // Remove existing rendered SVGs, re-insert fresh <pre class="mermaid">
              var oldBlocks = container.querySelectorAll('.mermaid');
              for (var i = 0; i < oldBlocks.length; i++) {
                var fresh = document.createElement('pre');
                fresh.className = 'mermaid';
                fresh.textContent = mermaidSources[i] || '';
                oldBlocks[i].parentNode.replaceChild(fresh, oldBlocks[i]);
              }
              mermaid.initialize({
                theme: 'base',
                startOnLoad: false,
                themeVariables: {
                  background: 'transparent',
                  primaryColor:    isDark ? '#3D3530' : '#f0e8e0',
                  primaryBorderColor: isDark ? '#8B7565' : '#8B6F5C',
                  primaryTextColor:   isDark ? '#D8D0C8' : '#2C2C2C',
                  secondaryColor:     isDark ? '#2E2824' : '#e8e0d8',
                  tertiaryColor:      isDark ? '#35302B' : '#f5f0eb',
                  lineColor:          isDark ? '#5C5650' : '#A09890',
                  textColor:          isDark ? '#C8C0B8' : '#2C2C2C',
                  fontSize: '14px',
                }
              });
              mermaid.run();
              setTimeout(function () {
                var svgs = document.querySelectorAll('.mermaid svg');
                for (var i2 = 0; i2 < svgs.length; i2++) {
                  var rects = svgs[i2].querySelectorAll('rect');
                  for (var j = 0; j < rects.length; j++) {
                    if (rects[j].getAttribute('width') && rects[j].getAttribute('height') &&
                        parseFloat(rects[j].getAttribute('width')) > 300) {
                      rects[j].setAttribute('fill', 'transparent');
                    }
                  }
                }
              }, 200);
            };
            window.renderMermaid();
            document.addEventListener('theme-changed', function () {
              window.renderMermaid();
            });
          }
        } else {
          contentEl.innerHTML = '<p data-i18n="post.not_found">这片羽毛被风吹散了。</p>';
        }

        document.getElementById('post-meta').textContent = date + ' · ' + Posts.readingTime(contentEl.textContent, lang);

        var prev = await Posts.prevPost(slug);
        var next = await Posts.nextPost(slug);
        var navEl = document.getElementById('post-nav');
        if (!navEl) return;

        var navHtml = '';
        if (prev) {
          var prevTitle = Posts.localize(prev, 'title', lang);
          var prevDate = Posts.formatDate(prev.date);
          navHtml += '<a href="post.html?slug=' + prev.slug + '" class="post-nav-card post-nav-prev">' +
            '<span class="post-nav-label">← ' + I18n.t('post.prev') + '</span>' +
            '<span class="post-nav-title">' + prevTitle + '</span>' +
            '<span class="post-nav-date">' + prevDate + '</span>' +
            '</a>';
        }
        if (next) {
          var nextTitle = Posts.localize(next, 'title', lang);
          var nextDate = Posts.formatDate(next.date);
          navHtml += '<a href="post.html?slug=' + next.slug + '" class="post-nav-card post-nav-next">' +
            '<span class="post-nav-label">' + I18n.t('post.next') + ' →</span>' +
            '<span class="post-nav-title">' + nextTitle + '</span>' +
            '<span class="post-nav-date">' + nextDate + '</span>' +
            '</a>';
        }
        navEl.innerHTML = navHtml;

        Comments.init();
        I18n.apply();
      } catch (e) {
        console.error('[Post] render error:', e.message || e, e.stack);
        setTitle('羽翼未丰');
        var ce = document.getElementById('post-content');
        if (ce) ce.innerHTML = '<p style="text-align:center;color:var(--color-text-muted);">这片羽毛还未落下，请稍后再试。<br><small>' + (e.message || e) + '</small></p>';
      }
    }

    function setTitle(text) {
      var el = document.getElementById('post-title');
      if (el) el.textContent = text;
    }
    function addCopyButtons(container) {
      var copyIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>';
      var checkIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>';
      var blocks = container.querySelectorAll('pre');
      for (var i = 0; i < blocks.length; i++) {
        if (blocks[i].classList.contains('mermaid')) continue;
        var btn = document.createElement('button');
        btn.className = 'copy-btn';
        btn.innerHTML = copyIcon;
        btn.title = 'Copy code';
        btn.onclick = function () {
          var code = this.parentNode.querySelector('code');
          var text = code ? code.textContent : this.parentNode.textContent;
          var self = this;

          function onSuccess() {
            self.innerHTML = checkIcon;
            self.classList.add('copied');
            self.title = 'Copied';
            setTimeout(function () {
              self.innerHTML = copyIcon;
              self.classList.remove('copied');
              self.title = 'Copy code';
            }, 1500);
          }

          // Clipboard API (requires HTTPS or localhost)
          if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(text).then(onSuccess).catch(function () {
              fallbackCopy(text);
            });
          } else {
            fallbackCopy(text);
          }

          function fallbackCopy(text) {
            var textarea = document.createElement('textarea');
            textarea.value = text;
            textarea.style.position = 'fixed';
            textarea.style.left = '-9999px';
            textarea.style.top = '-9999px';
            document.body.appendChild(textarea);
            textarea.focus();
            textarea.select();
            try {
              document.execCommand('copy');
              onSuccess();
            } catch (e) {}
            document.body.removeChild(textarea);
          }
        };
        blocks[i].appendChild(btn);
      }
    }

    function initLightbox(container) {
      var lb = document.getElementById('lightbox');
      if (!lb) return;
      var lbImg = lb.querySelector('.lightbox-img');
      var imgs = container.querySelectorAll('img');
      function close() {
        lb.classList.remove('open');
        lb.setAttribute('aria-hidden', 'true');
        setTimeout(function () { lbImg.src = ''; }, 300);
      }
      for (var i = 0; i < imgs.length; i++) {
        imgs[i].addEventListener('click', function () {
          lbImg.src = this.src;
          lbImg.alt = this.alt || '';
          lb.classList.add('open');
          lb.setAttribute('aria-hidden', 'false');
        });
      }
      lb.querySelector('.lightbox-backdrop').addEventListener('click', close);
      lb.querySelector('.lightbox-close').addEventListener('click', close);
      document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape' && lb.classList.contains('open')) close();
      });
    }

    function setMeta(selector, value) {
      var el = document.querySelector(selector);
      if (el) el.content = value;
    }

    /* ---- Build collapsible tree TOC ---- */
    function buildTOC() {
      var nav = document.getElementById('toc-nav');
      var content = document.getElementById('post-content');
      if (!nav || !content) return;

      var headings = content.querySelectorAll('h2, h3');
      if (headings.length < 2) {
        document.getElementById('post-toc').style.display = 'none';
        return;
      }

      var html = '';
      var tocIdx = 0;
      for (var i = 0; i < headings.length; i++) {
        var h = headings[i];
        var id = 'toc-' + tocIdx;
        h.id = id;
        tocIdx++;

        if (h.tagName === 'H2') {
          // Collect following h3 children
          var children = '';
          var j = i + 1;
          while (j < headings.length && headings[j].tagName === 'H3') {
            var h3id = 'toc-' + tocIdx;
            headings[j].id = h3id;
            children += '<a href="#' + h3id + '" class="toc-link toc-h3">' + headings[j].textContent + '</a>';
            tocIdx++;
            j++;
          }
          if (children) {
            html += '<div class="toc-group">' +
              '<a href="#' + id + '" class="toc-link toc-h2" onclick="toggleTOCGroup(this)">' +
                '<span class="toc-toggle">▾</span>' + h.textContent +
              '</a>' +
              '<div class="toc-children">' + children + '</div>' +
            '</div>';
            i = j - 1;
          } else {
            html += '<a href="#' + id + '" class="toc-link toc-h2">' + h.textContent + '</a>';
          }
        } else {
          // Standalone h3 (no parent h2)
          html += '<a href="#' + id + '" class="toc-link toc-h3">' + h.textContent + '</a>';
        }
      }
      nav.innerHTML = html;
    }

    /* ---- Toggle TOC group collapse ---- */
    function toggleTOCGroup(link) {
      var group = link.parentNode;
      group.classList.toggle('toc-collapsed-group');
    }
    window.toggleTOCGroup = toggleTOCGroup;

    /* ---- Scroll spy: highlight active TOC item ---- */
    var tocScrollTimer = null;
    window.addEventListener('scroll', function () {
      if (tocScrollTimer) return;
      tocScrollTimer = setTimeout(function () {
        tocScrollTimer = null;
        var links = document.querySelectorAll('#toc-nav a');
        if (!links.length) return;
        var active = null;
        for (var i = links.length - 1; i >= 0; i--) {
          var id = links[i].getAttribute('href').substring(1);
          var el = document.getElementById(id);
          if (el && el.getBoundingClientRect().top < window.innerHeight * 0.4) {
            active = links[i];
            break;
          }
        }
        for (var j = 0; j < links.length; j++) {
          links[j].classList.remove('toc-active');
        }
        if (active) active.classList.add('toc-active');
      }, 80);
    });

    /* Reading progress bar */
    window.addEventListener('scroll', function () {
      var bar = document.getElementById('progress-bar');
      if (!bar) return;
      var scrollTop = window.pageYOffset || document.documentElement.scrollTop;
      var total = document.documentElement.scrollHeight - window.innerHeight;
      if (total <= 0) { bar.style.width = '0'; return; }
      bar.style.width = Math.min((scrollTop / total) * 100, 100) + '%';
    });

    /* Expose for language switch */
    window.reloadPost = async function () {
      await renderPost(_currentSlug);
    };

    /* Init */
    window.initPost = async function (slug) {
      await renderPost(slug || Router.get('slug'));
    };
  </script>
